name: Atmos Off-Hour Reading Verification
on:
  push:
    branches:
      - research/daily-walk-forward-20261101
    paths:
      - .github/workflows/test-off-hour-recovery.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run actual timestamp and nearest-hour unit tests
        run: python -m unittest discover -s tests -p test_global_observation_archive.py -v
      - name: Fetch and compare real NOAA off-hour records
        run: |
          python -c 'from pathlib import Path; from atmos.global_observation_archive import download_year; p=Path("hourly-exact"); p.mkdir(); q=Path("hourly-nearest"); q.mkdir(); station={"id":"72026912982"}; a=download_year(2007,station,p,hourly_selection="exact"); b=download_year(2007,station,q,hourly_selection="nearest"); print("Exact",a); print("Nearest",b); assert b.get("rows",0)>=a.get("rows",0)'
