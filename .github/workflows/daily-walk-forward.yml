name: Atmos Daily Walk-Forward Research Pilot
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID with an artifact named atmos-independent-pairs containing forecasts.csv and observations.csv"
        required: true
        type: string
      holdout_start:
        description: "UTC holdout date (YYYY-MM-DDT00:00:00Z)"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download externally verified input pair artifact
        uses: actions/download-artifact@v4
        with:
          name: atmos-independent-pairs
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs
      - name: Verify expected inputs exist
        run: |
          test -s inputs/forecasts.csv
          test -s inputs/observations.csv
      - name: Chronological replay (research only)
        run: |
          python -m atmos.walk_forward --forecasts inputs/forecasts.csv --observations inputs/observations.csv --holdout-start "${{ inputs.holdout_start }}" --output walk-forward-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atmos-walk-forward-report
          path: walk-forward-report.json
          retention-days: 30
