name: Atmos Actual-Observation Historical Training Pilot
on:
  push:
    branches:
      - research/daily-walk-forward-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-data-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify walk-forward tests
        run: python -m unittest discover -s tests -p 'test_walk_forward.py' -v
      - name: Download genuine archived forecasts and station observations, then replay
        run: python -m atmos.real_data_pilot
      - name: Archive real-source manifest and scored output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atmos-verified-source-pilot
          path: pilot-results/
          retention-days: 30
