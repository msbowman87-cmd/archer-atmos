name: Atmos Remaining Nine Years
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-study-remaining.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  yearly-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: [1,2,3,4,5,6,7,8,9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect full annual batch
        run: python -m atmos.study_batch --batch ${{ matrix.batch }} --limit 200 --output study-results
      - name: Strict completeness and missingness audit
        run: python -m atmos.audit_batch --batch ${{ matrix.batch }} --output study-results
      - name: Upload annual data and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atmos-study-year-${{ matrix.batch }}-${{ github.run_id }}
          path: study-results/
          retention-days: 30
          if-no-files-found: warn
