name: Atmos station inventory selection
on:
  workflow_dispatch:
    inputs:
      batches:
        description: Maximum new batches per provider (1-120)
        default: '100'
        required: true
  push:
    branches:
      - research/daily-walk-forward-20261101
    paths:
      - .github/workflows/atmos-station-inventory.yml
concurrency:
  group: atmos-hourly-research-collection
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  select:
    if: github.ref == 'refs/heads/research/daily-walk-forward-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused offline regression tests
        run: |
          python -m unittest discover -s tests -p test_multi_provider_station_selection.py -v
          python -m unittest discover -s tests -p test_selected_hourly_collection.py -v
      - name: Resume latest checkpoint on this research branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prior=$(gh api "repos/$GH_REPO/actions/artifacts?name=atmos-multi-provider-checkpoint&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "research/daily-walk-forward-20261101")] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [ -n "$prior" ]; then
            gh run download "$prior" --name atmos-multi-provider-checkpoint --dir "$RUNNER_TEMP/atmos-checkpoint"
            cp -a "$RUNNER_TEMP/atmos-checkpoint/." research/station-selection-20261105/
          else
            echo "No verified collection checkpoint available; stopping instead of substituting a new station list." >&2
            exit 1
          fi
      - name: Verify frozen station selection
        id: verify
        run: |
          python scripts/verify_station_manifest.py --input research/station-selection-20261105
      - name: Collect NOAA station-year batches
        env:
          BATCHES: ${{ inputs.batches || '100' }}
        run: |
          python -c 'import os; n=int(os.environ["BATCHES"]); assert 1 <= n <= 120'
          python scripts/collect_selected_hourly.py --manifest research/station-selection-20261105/stations.csv --out research/station-selection-20261105/observations --providers NOAA_GHCNh --max-batches "$BATCHES" --workers 2
      - name: Collect ECCC station-month batches
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          BATCHES: ${{ inputs.batches || '100' }}
        run: |
          python -c 'import os; n=int(os.environ["BATCHES"]); assert 1 <= n <= 120'
          python scripts/collect_selected_hourly.py --manifest research/station-selection-20261105/stations.csv --out research/station-selection-20261105/observations --providers ECCC --max-batches "$BATCHES" --workers 2
      - name: Collect IEM station-month batches
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          BATCHES: ${{ inputs.batches || '100' }}
        run: |
          python -c 'import os; n=int(os.environ["BATCHES"]); assert 1 <= n <= 120'
          python scripts/collect_selected_hourly.py --manifest research/station-selection-20261105/stations.csv --out research/station-selection-20261105/observations --providers IEM_ASOS --max-batches "$BATCHES" --workers 1
      - name: Verify checkpoint integrity and summarize progress
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          python scripts/summarize_hourly_collection.py --manifest research/station-selection-20261105/stations.csv --out research/station-selection-20261105/observations --verify-hashes --report research/station-selection-20261105/collection_progress.json
          cp docs/atmos-hourly-collection.md research/station-selection-20261105/DATA_ATTRIBUTION.md
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.verify.outcome == 'success' }}
        with:
          name: atmos-multi-provider-checkpoint
          path: research/station-selection-20261105/
          retention-days: 90
          compression-level: 6
