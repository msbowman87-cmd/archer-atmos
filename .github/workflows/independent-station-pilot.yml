name: Independent Station Forecast Pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/independent-station-pilot.yml'
      - 'atmos/station_backtest.py'
      - 'atmos/independent_validation.py'
      - 'tests/test_station_backtest.py'
permissions:
  contents: read
jobs:
  twin-falls-station:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Independent Twin Falls ASOS vs archived ECMWF forecasts
        run: python -m atmos.station_backtest --station TWF --network ID_ASOS --latitude 42.4818 --longitude -114.4877 --timezone America/Boise --start 2026-09-01 --end 2026-09-07
      - name: Upload raw paired inputs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-twf-pilot
          path: station-validation-results/
          retention-days: 30
          if-no-files-found: warn
